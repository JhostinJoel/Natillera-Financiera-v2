<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Natillera Financiera{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='pending.css') }}"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body><nav><div class="brand"><span class="brand-mark">₦</span><span>Natillera <small>FINANCIERA</small></span></div><div class="nav-links"><a href="{{ url_for('main.dashboard') }}">Ahorros</a><a href="{{ url_for('main.participants') }}">Participantes</a><a href="{{ url_for('main.loans') }}">Préstamos</a><a href="{{ url_for('main.annual_report') }}">Reportes</a></div><div class="secure"><span class="dot"></span> Sistema seguro</div></nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash" data-category="{{ category }}" data-message="{{ message }}"></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script>function money(v){return '$'+Number(v||0).toLocaleString('es-CO',{maximumFractionDigits:0});}document.addEventListener('submit',function(e){var f=e.target;if(f.classList.contains('loan-cancel-form')){e.preventDefault();e.stopImmediatePropagation();Swal.fire({title:'¿Cancelar préstamo?',text:'El historial se conservará y el préstamo quedará cancelado.',icon:'warning',showCancelButton:true,confirmButtonText:'Sí, cancelar préstamo',cancelButtonText:'No, volver',confirmButtonColor:'#b84b4b'}).then(function(r){if(r.isConfirmed)f.submit()})}else if(f.classList.contains('loan-edit-form')){e.preventDefault();e.stopImmediatePropagation();Swal.fire({title:'¿Actualizar préstamo?',text:'Se regenerará el plan de pagos con los nuevos datos.',icon:'question',showCancelButton:true,confirmButtonText:'Sí, actualizar',cancelButtonText:'Cancelar',confirmButtonColor:'#0d332c'}).then(function(r){if(r.isConfirmed)f.submit()})}else if(f.classList.contains('participant-deactivate-form')){e.preventDefault();e.stopImmediatePropagation();Swal.fire({title:'¿Desactivar participante?',text:'Su historial financiero se conservará.',icon:'warning',showCancelButton:true,confirmButtonText:'Sí, desactivar',cancelButtonText:'Cancelar',confirmButtonColor:'#b84b4b'}).then(function(r){if(r.isConfirmed)f.submit()})}else if(f.classList.contains('participant-edit-form')){e.preventDefault();e.stopImmediatePropagation();Swal.fire({title:'¿Guardar cambios?',text:'Se actualizarán los datos del participante.',icon:'question',showCancelButton:true,confirmButtonText:'Sí, guardar',cancelButtonText:'Cancelar',confirmButtonColor:'#0d332c'}).then(function(r){if(r.isConfirmed)f.submit()})}},true);document.querySelectorAll('.flash').forEach(function(el){Swal.fire({toast:true,position:'top-end',icon:el.dataset.category==='error'?'error':'success',title:el.dataset.message,showConfirmButton:false,timer:3000,timerProgressBar:true});});document.addEventListener('submit',function(e){var f=e.target;if(f.classList.contains('contribution-form')){var input=f.querySelector('[name=amount]'),raw=input.value.trim(),paid=Number(f.dataset.paid||0),due=Number(f.dataset.due||0),amount=raw?Number(raw):due-paid;e.preventDefault();Swal.fire({title:'¿Estás seguro?',html:'Cuota mensual: <b>'+money(due)+'</b><br>Abono que vas a registrar: <b>'+money(amount)+'</b><br>Abonado hasta ahora: <b>'+money(paid)+'</b>',icon:'question',showCancelButton:true,confirmButtonText:'Sí, guardar abono',cancelButtonText:'Cancelar',confirmButtonColor:'#0d332c'}).then(function(r){if(r.isConfirmed)f.submit()})}else if(f.classList.contains('reset-form')){var month=f.dataset.month,paid=f.dataset.paid;e.preventDefault();Swal.fire({title:'¿Estás seguro?',html:'¿Quieres reiniciar el abono del mes de <b>'+month+'</b>?<br>Valor que se reiniciará: <b>'+money(paid)+'</b><br>El nuevo valor será: <b>$0</b>',icon:'warning',showCancelButton:true,confirmButtonText:'Sí, reiniciar',cancelButtonText:'Cancelar',confirmButtonColor:'#b84b4b'}).then(function(r){if(r.isConfirmed)f.submit()})}else if(f.classList.contains('participant-form')){e.preventDefault();Swal.fire({title:'Crear participante',text:'¿Estás seguro de que quieres crear este participante?',icon:'question',showCancelButton:true,confirmButtonText:'Sí, crear',cancelButtonText:'Cancelar',confirmButtonColor:'#0d332c'}).then(function(r){if(r.isConfirmed)f.submit()})}});</script></body></html>
